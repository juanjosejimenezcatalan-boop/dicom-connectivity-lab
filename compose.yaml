services:
  orthanc-a:
    image: orthancteam/orthanc:26.8.2
    container_name: dicom-lab-orthanc-a
    restart: unless-stopped
    ports:
      - "127.0.0.1:8044:8042" # REST/UI, host-local only
      - "127.0.0.1:4244:4242" # DICOM, host-local only
    volumes:
      - ./orthanc-a/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc-a/data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD", "Orthanc", "--version"]
      interval: 5s
      timeout: 3s
      retries: 20

  orthanc-b:
    image: orthancteam/orthanc:26.8.2
    container_name: dicom-lab-orthanc-b
    restart: unless-stopped
    ports:
      - "127.0.0.1:8045:8042" # REST/UI, host-local only
      - "127.0.0.1:4245:4242" # DICOM, host-local only
    volumes:
      - ./orthanc-b/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc-b/data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD", "Orthanc", "--version"]
      interval: 5s
      timeout: 3s
      retries: 20

